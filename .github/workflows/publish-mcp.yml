# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io) as
# io.github.ssap-pa/feedback-memory. Run it by hand from the Actions tab after a release:
# server.json points at that release's feedback-memory.mcpb and its SHA-256.
name: Publish to MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login for the io.github.ssap-pa/* namespace
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
