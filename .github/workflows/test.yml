name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: MCP server (end-to-end over stdio)
        run: npm ci && npm test
      - name: Demo loop
        working-directory: demo
        run: npm install --no-audit --no-fund && npm test
